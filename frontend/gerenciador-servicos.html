<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Serviços | Descubra+ Cajazeiras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles/index.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.png">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com https://cdn.jsdelivr.net;
    script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
    font-src 'self' https://cdnjs.cloudflare.com;
    connect-src 'self' https://nominatim.openstreetmap.org https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
  ">
</head>
<body>
  <header>
    <div class="logo">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logotipo.png" alt="Logo Descubra+ Cajazeiras">
      </a>
    </div>
    <nav class="menu-centro">
      <a href="index.html" class="btn btn-outline-light me-2">
        <i class="fas fa-arrow-left me-1"></i> Voltar ao Mapa
      </a>
      <button class="btn btn-outline-light me-2" id="btnNovoServico">
        <i class="fas fa-plus me-1"></i> Novo Serviço
      </button>
    </nav>
    <div class="usuario" id="usuario-area"></div>
  </header>

  <main>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0 titulo-servicos-eventos"><i class="fas fa-store me-2"></i> Meus Serviços</h5>
                <button class="btn btn-sm btn-outline-primary" id="btnAtualizarServicos">
                  <i class="fas fa-sync-alt"></i>
                </button>
              </div>

              <div class="row text-center mb-3">
                <div class="col-4">
                  <div class="border rounded p-2">
                    <small class="text-muted">Total</small>
                    <div class="fw-bold" id="totalServicosContagem">0</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="border rounded p-2">
                    <small class="text-muted">Hospedagem</small>
                    <div class="fw-bold text-success" id="totalHospedagem">0</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="border rounded p-2">
                    <small class="text-muted">Alimentação</small>
                    <div class="fw-bold text-warning" id="totalAlimentacao">0</div>
                  </div>
                </div>
              </div>

              <!-- Filtros por Tipo -->
              <div class="mb-3">
                <div class="btn-group w-100" role="group" id="filtrosServicos">
                  <input type="radio" class="btn-check" name="filtroServico" id="filtroTodosServicos" value="" checked>
                  <label class="btn btn-outline-secondary btn-sm" for="filtroTodosServicos">
                    <i class="fas fa-list me-1"></i><span>Todos</span>
                  </label>

                  <input type="radio" class="btn-check" name="filtroServico" id="filtroHosp" value="Hospedagem">
                  <label class="btn btn-outline-secondary btn-sm" for="filtroHosp">
                    <i class="fas fa-hotel me-1"></i><span>Hospedagem</span>
                  </label>

                  <input type="radio" class="btn-check" name="filtroServico" id="filtroAlim" value="Alimentação/Lazer">
                  <label class="btn btn-outline-secondary btn-sm" for="filtroAlim">
                    <i class="fas fa-utensils me-1"></i><span>Alimentação</span>
                  </label>

                  <input type="radio" class="btn-check" name="filtroServico" id="filtroPonto" value="Ponto Turístico">
                  <label class="btn btn-outline-secondary btn-sm" for="filtroPonto">
                    <i class="fas fa-landmark me-1"></i><span>Turístico</span>
                  </label>
                </div>
              </div>

              <div class="input-group input-group-sm">
                <input type="text" class="form-control" id="inputBuscaServicos" placeholder="Buscar serviço...">
                <button class="btn btn-outline-secondary" type="button" id="btnBuscarServico">
                  <i class="fas fa-search"></i>
                </button>
                <button class="btn btn-outline-secondary" type="button" id="btnLimparBuscaServico" style="display: none;">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
            <div class="card-body p-0">
              <div id="loadingServicos" class="text-center p-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Carregando...</span>
                </div>
              </div>
              <div id="listaServicos" class="list-group list-group-flush" style="max-height: 600px; overflow-y: auto;">
              </div>
              <div id="nenhumServico" class="text-center p-4 text-muted" style="display: none;">
                <i class="fas fa-map-marker-alt fa-3x mb-3"></i>
                <p>Nenhum serviço cadastrado.</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0"><i class="fas fa-th-large me-2"></i> Detalhes dos Serviços</h5>
            </div>
            <div class="card-body">
              <div id="detalhesServico" class="text-center text-muted py-5">
                <i class="fas fa-info-circle fa-3x mb-3"></i>
                <p>Selecione um serviço na lista para ver os detalhes</p>
              </div>
              <div id="cardDetalhesServico" style="display: none;">
                <div class="row mb-4">
                  <div class="col-md-8">
                    <h4 id="servicoNome" class="text-primary mb-2"></h4>
                    <p id="servicoDescricao" class="text-muted mb-3"></p>
                    <div class="badge" id="servicoTipo"></div>
                    <div class="mt-3">
                      <h6><i class="fas fa-phone me-2"></i>Contato</h6>
                      <p id="servicoTelefone" class="mb-1"></p>
                      <p id="servicoInstagram" class="mb-1"></p>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="card bg-light">
                      <div class="card-body">
                        <h6><i class="fas fa-star me-2 text-warning"></i>Avaliação</h6>
                        <div class="mb-3">
                          <h5 id="servicoMedia" class="text-primary mb-1">4.5</h5>
                          <div id="servicoEstrelas"></div>
                          <small id="servicoQtdAval" class="text-muted"></small>
                        </div>
                        <button class="btn btn-sm btn-outline-primary w-100" id="btnVerAvaliacoes">
                          <i class="fas fa-comments me-1"></i>Ver Avaliações
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <div id="servicoMiniMapa" style="height: 300px; border-radius: 8px; margin-bottom: 20px;"></div>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-primary" id="btnEditarServico">
                    <i class="fas fa-edit me-1"></i>Editar
                  </button>
                  <button class="btn btn-outline-danger" id="btnExcluirServico">
                    <i class="fas fa-trash me-1"></i>Excluir
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/auth.js"></script>
  <script type="module" src="./scripts/gerenciadorServicos.js"></script>
</body>
</html>
